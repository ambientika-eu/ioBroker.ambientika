version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "17 3 9 * *"
      timezone: Europe/Rome
    open-pull-requests-limit: 15
    versioning-strategy: increase
    ignore:
      # The Node.js types follow the oldest Node.js version the adapter supports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "17 3 9 * *"
      timezone: Europe/Rome
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
